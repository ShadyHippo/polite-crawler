name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Tests (no network except loopback)
        run: python -m unittest discover -s tests -t . -v

      - name: The CLI answers
        run: |
          python -m archivebase --help > /dev/null
          arcb --help > /dev/null

      - name: Audit itself
        run: |
          python -m archivebase audit . --skip tests
